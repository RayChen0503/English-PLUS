name: iOS hardening compile gate

on:
  workflow_dispatch:
  push:
    branches:
      - codex/app-store-hardening-c
    paths:
      - .github/ci-triggers/round10-ios-build
      - .github/ci-triggers/round11-ios-build
      - .github/ci-triggers/round12-ios-build

permissions:
  contents: read

concurrency:
  group: ios-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-build:
    name: Validate and compile English+
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show Xcode toolchain
        run: xcodebuild -version

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            workers/englishplus-ai-proxy/package-lock.json
            admin-web/package-lock.json

      - name: Use Java 21 for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Validate Cloudflare AI gateway
        working-directory: workers/englishplus-ai-proxy
        run: |
          npm ci
          npm run check
          npm test

      - name: Validate administrator review portal
        working-directory: admin-web
        run: |
          npm ci
          npm run check

      - name: Validate Firestore rules and classroom lifecycle
        run: |
          npm --prefix firebase-tests ci
          npx --yes firebase-tools@15.23.0 emulators:exec \
            --only firestore \
            --project demo-englishplus-round6 \
            "npm --prefix firebase-tests test"

      - name: Create non-production Firebase build config
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import plistlib

          path = Path("ios/EnglishPlus/EnglishPlus/GoogleService-Info.plist")
          payload = {
              "API_KEY": "ci-placeholder",
              "GCM_SENDER_ID": "000000000000",
              "PLIST_VERSION": "1",
              "BUNDLE_ID": "com.englishplus",
              "PROJECT_ID": "englishplus-ci-placeholder",
              "STORAGE_BUCKET": "englishplus-ci-placeholder.appspot.com",
              "IS_ADS_ENABLED": False,
              "IS_ANALYTICS_ENABLED": False,
              "IS_APPINVITE_ENABLED": False,
              "IS_GCM_ENABLED": True,
              "IS_SIGNIN_ENABLED": True,
              "GOOGLE_APP_ID": "1:000000000000:ios:0000000000000000",
              "CLIENT_ID": "placeholder.apps.googleusercontent.com",
              "REVERSED_CLIENT_ID": "com.googleusercontent.apps.placeholder",
          }
          path.write_bytes(plistlib.dumps(payload, fmt=plistlib.FMT_XML, sort_keys=True))
          PY
          plutil -lint ios/EnglishPlus/EnglishPlus/GoogleService-Info.plist

      - name: Validate hardening contracts
        run: |
          python3 scripts/validate_app_store_hardening_round5.py
          python3 scripts/validate_app_store_hardening_round6.py
          python3 scripts/validate_app_store_hardening_round7.py
          python3 scripts/validate_app_store_hardening_round8.py
          python3 scripts/validate_app_store_hardening_round9.py
          python3 scripts/validate_app_store_hardening_round10.py
          python3 scripts/validate_app_store_hardening_round11.py
          python3 scripts/validate_app_store_hardening_round12.py
          python3 scripts/validate_testflight_onboarding_hotfix.py
          python3 scripts/validate_ios_xcode_project_sources.py
          python3 scripts/validate_fix_a_support_sync.py
          python3 scripts/validate_fix_b_practice_flow.py
          python3 scripts/validate_fix_c_class_lifecycle.py
          python3 scripts/validate_fix_d_admin_portal.py

      - name: Build iOS Simulator target
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/EnglishPlus/EnglishPlus.xcodeproj \
            -scheme EnglishPlus \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/EnglishPlusDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Run authentication acceptance tests
        shell: bash
        run: |
          set -o pipefail
          SIMULATOR_UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for runtime in data["devices"].values() for device in runtime if device["name"].startswith("iPhone")))')"
          test -n "$SIMULATOR_UDID"
          xcodebuild \
            -project ios/EnglishPlus/EnglishPlus.xcodeproj \
            -scheme EnglishPlus \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/EnglishPlusTestDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            test
